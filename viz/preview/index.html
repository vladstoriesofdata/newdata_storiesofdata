<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily revenue</title>
  <style>
    :root { color-scheme: light; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 32px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; }
    p { margin: 0 0 20px; max-width: 62ch; }
    .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 13px; }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  </style>
</head>
<body>
  <h1>Daily revenue</h1>
  <p>One HTML file and D3. The sums already exist in DuckDB. This page only draws <code>daily_revenue.json</code>.</p>
  <div id="chart"></div>
  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const data = await d3.json("./daily_revenue.json");
    const dates = [...new Set(data.map((d) => d.order_date))];
    const channels = [...new Set(data.map((d) => d.channel))];
    const colors = d3.scaleOrdinal().domain(channels).range(["#1f4b99", "#c46b2c"]);

    const margin = {top: 12, right: 12, bottom: 32, left: 56};
    const width = 720;
    const height = 320;
    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("role", "img")
      .attr("aria-label", "Revenue by day and channel");

    const x0 = d3.scaleBand().domain(dates).range([margin.left, width - margin.right]).padding(0.2);
    const x1 = d3.scaleBand().domain(channels).range([0, x0.bandwidth()]).padding(0.08);
    const y = d3.scaleLinear()
      .domain([0, d3.max(data, (d) => d.revenue)])
      .nice()
      .range([height - margin.bottom, margin.top]);

    svg.append("g")
      .attr("transform", `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x0).tickFormat((d) => d.slice(5)))
      .call((g) => g.select(".domain").remove());

    svg.append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(",.0f")))
      .call((g) => g.select(".domain").remove());

    svg.append("g")
      .selectAll("g")
      .data(dates)
      .join("g")
      .attr("transform", (d) => `translate(${x0(d)},0)`)
      .selectAll("rect")
      .data((date) => channels.map((channel) => data.find((d) => d.order_date === date && d.channel === channel) || {channel, revenue: 0}))
      .join("rect")
      .attr("x", (d) => x1(d.channel))
      .attr("y", (d) => y(d.revenue))
      .attr("width", x1.bandwidth())
      .attr("height", (d) => y(0) - y(d.revenue))
      .attr("fill", (d) => colors(d.channel));

    const legend = d3.select("#chart").append("div").attr("class", "legend");
    for (const channel of channels) {
      legend.append("span").html(`<i class="swatch" style="background:${colors(channel)}"></i>${channel}`);
    }
  </script>
</body>
</html>
