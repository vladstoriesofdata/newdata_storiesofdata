<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company financials</title>
  <style>
    body { font: 15px/1.45 system-ui, sans-serif; margin: 32px; max-width: 960px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 28px 0 8px; }
    p { margin: 0 0 12px; max-width: 68ch; }
    label { display: block; margin: 8px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid #ddd; }
    th:first-child, td:first-child { text-align: left; }
    svg text { font-size: 11px; }
  </style>
</head>
<body>
  <h1>Company financials</h1>
  <p>Amounts are RON. Totals come from the semantic queries. This page only draws them.</p>

  <h2>National turnover</h2>
  <div id="national"></div>
  <div id="national-table"></div>

  <h2>County turnover</h2>
  <label>Year <select id="year"></select></label>
  <div id="county"></div>

  <h2>One company</h2>
  <label>Name, brand, or CUI <input id="query" placeholder="McDonald" /></label>
  <label>Match <select id="match"></select></label>
  <p id="identity"></p>
  <div id="company"></div>
  <div id="company-table"></div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const [national, counties, companies, series] = await Promise.all([
      d3.json("./national_year.json"),
      d3.json("./county_year.json"),
      d3.json("./companies.json"),
      d3.json("./company_year.json")
    ]);
    const money = d3.format(",.0f");
    const yearSelect = document.querySelector("#year");
    const years = [...new Set(counties.map(d => d.fiscal_year))].sort((a, b) => a - b);

    function bars(target, data, label, value) {
      const node = document.querySelector(target);
      node.innerHTML = "";
      const margin = {top: 8, right: 16, bottom: 28, left: label === "county" ? 120 : 48};
      const width = 720;
      const height = label === "county" ? Math.max(240, data.length * 16 + margin.top + margin.bottom) : 280;
      const svg = d3.select(node).append("svg").attr("width", width).attr("height", height);
      const horizontal = label === "county";
      if (horizontal) {
        const x = d3.scaleLinear().domain([0, d3.max(data, d => d.turnover_ron)]).nice().range([margin.left, width - margin.right]);
        const y = d3.scaleBand().domain(data.map(d => d.county)).range([margin.top, height - margin.bottom]).padding(0.15);
        svg.append("g").attr("transform", `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(4).tickFormat(d3.format("~s")));
        svg.append("g").attr("transform", `translate(${margin.left},0)`).call(d3.axisLeft(y));
        svg.append("g").selectAll("rect").data(data).join("rect")
          .attr("x", margin.left)
          .attr("y", d => y(d.county))
          .attr("width", d => x(d.turnover_ron) - margin.left)
          .attr("height", y.bandwidth())
          .attr("fill", "#1f4b99");
      } else {
        const x = d3.scaleBand().domain(data.map(d => d.fiscal_year)).range([margin.left, width - margin.right]).padding(0.2);
        const y = d3.scaleLinear().domain([0, d3.max(data, d => d.turnover_ron)]).nice().range([height - margin.bottom, margin.top]);
        svg.append("g").attr("transform", `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).tickFormat(d3.format("d")));
        svg.append("g").attr("transform", `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(d3.format("~s")));
        svg.append("g").selectAll("rect").data(data).join("rect")
          .attr("x", d => x(d.fiscal_year))
          .attr("y", d => y(d.turnover_ron))
          .attr("width", x.bandwidth())
          .attr("height", d => y(0) - y(d.turnover_ron))
          .attr("fill", "#1f4b99");
      }
    }

    function table(target, rows, columns) {
      const node = document.querySelector(target);
      const head = columns.map(column => `<th>${column.label}</th>`).join("");
      const body = rows.map(row => `<tr>${columns.map(column => `<td>${column.value(row)}</td>`).join("")}</tr>`).join("");
      node.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    const numberColumns = [
      {label: "Year", value: d => d.fiscal_year},
      {label: "Companies", value: d => d.companies},
      {label: "Turnover", value: d => money(d.turnover_ron)},
      {label: "Profit", value: d => money(d.profit_ron)},
      {label: "Employees", value: d => money(d.employees)},
      {label: "Margin", value: d => d.profit_margin == null ? "" : (d.profit_margin * 100).toFixed(1) + "%"}
    ];

    bars("#national", national, "year");
    table("#national-table", national, numberColumns);

    for (const year of years) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.append(option);
    }
    yearSelect.value = years[years.length - 1];
    function drawCounty() {
      const rows = counties
        .filter(d => d.fiscal_year === Number(yearSelect.value))
        .sort((a, b) => b.turnover_ron - a.turnover_ron);
      bars("#county", rows, "county");
    }
    yearSelect.addEventListener("change", drawCounty);
    drawCounty();

    const query = document.querySelector("#query");
    const match = document.querySelector("#match");
    const byCui = d3.group(series, d => d.cui);

    function drawCompany() {
      const text = query.value.trim().toLowerCase();
      const matches = text
        ? companies.filter(company => [company.company_name, company.brand, String(company.cui)].join(" ").toLowerCase().includes(text)).slice(0, 20)
        : [];
      const previous = match.value;
      match.innerHTML = "";
      for (const company of matches) {
        const option = document.createElement("option");
        option.value = company.cui;
        option.textContent = `${company.company_name} (${company.cui})`;
        match.append(option);
      }
      if ([...match.options].some(option => option.value === previous)) match.value = previous;
      const company = companies.find(item => String(item.cui) === match.value);
      const history = company ? (byCui.get(company.cui) || []).slice().sort((a, b) => a.fiscal_year - b.fiscal_year) : [];
      document.querySelector("#identity").textContent = company
        ? `${company.brand} · ${company.county} · ${company.locality} · CAEN ${company.caen} ${company.caen_label}`
        : "Type a name or CUI.";
      bars("#company", history.map(d => ({fiscal_year: d.fiscal_year, turnover_ron: d.turnover_ron})), "year");
      table("#company-table", history, [
        {label: "Year", value: d => d.fiscal_year},
        {label: "Turnover", value: d => money(d.turnover_ron)},
        {label: "Profit", value: d => money(d.profit_ron)},
        {label: "Employees", value: d => d.employees},
        {label: "Equity", value: d => d.equity_ron == null ? "" : money(d.equity_ron)}
      ]);
    }
    query.addEventListener("input", drawCompany);
    match.addEventListener("change", drawCompany);
    drawCompany();
  </script>
</body>
</html>
